<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <radialGradient id="bg2" cx="30%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#221347"/>
      <stop offset="65%" stop-color="#160c2f"/>
      <stop offset="100%" stop-color="#0f0820"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c6cf0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a88bff"/>
      <stop offset="100%" stop-color="#4dd6c1"/>
    </linearGradient>
    <linearGradient id="arcA" x1="330" y1="300" x2="190" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8f7bff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="arcB" x1="210" y1="387" x2="365" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4dd6c1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4dd6c1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="arcC" x1="195" y1="187" x2="237" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cfc4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cfc4ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7bff"/>
      <stop offset="100%" stop-color="#4dd6c1"/>
    </linearGradient>
    <path id="spark2" d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/>
  </defs>

  <rect x="8" y="8" width="984" height="584" rx="40" fill="url(#bg2)"/>

  <!-- swirl mark -->
  <circle cx="260" cy="300" r="140" fill="url(#glow2)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M330,300 A70,70 0 1 1 225,239.4" stroke="url(#arcA)" stroke-width="7"/>
    <path d="M210,386.6 A100,100 0 1 1 360,300" stroke="url(#arcB)" stroke-width="5"/>
    <path d="M195,187.4 A130,130 0 1 1 237.4,428" stroke="url(#arcC)" stroke-width="3"/>
  </g>
  <!-- converging particles -->
  <g>
    <circle cx="352" cy="252" r="4.5" fill="#8f7bff" opacity="0.75"/>
    <circle cx="163" cy="330" r="3.8" fill="#4dd6c1" opacity="0.7"/>
    <circle cx="300" cy="415" r="3.2" fill="#cfc4ff" opacity="0.6"/>
    <circle cx="150" cy="222" r="2.6" fill="#8f7bff" opacity="0.5"/>
    <circle cx="378" cy="345" r="2.8" fill="#4dd6c1" opacity="0.55"/>
    <circle cx="215" cy="150" r="2.2" fill="#cfc4ff" opacity="0.45"/>
    <circle cx="310" cy="200" r="2.4" fill="#4dd6c1" opacity="0.5"/>
    <circle cx="185" cy="440" r="2.0" fill="#8f7bff" opacity="0.4"/>
  </g>
  <!-- center gem -->
  <g>
    <polygon points="260,268 288,300 260,332 232,300" fill="url(#gem2)"/>
    <polygon points="260,268 288,300 260,300" fill="#ffffff" opacity="0.25"/>
    <polygon points="232,300 260,300 260,332" fill="#0e0a20" opacity="0.2"/>
    <polygon points="260,268 288,300 260,332 232,300" fill="none" stroke="#e6ddff" stroke-opacity="0.6" stroke-width="1.3"/>
  </g>
  <use href="#spark2" transform="translate(260,232) scale(0.6)" fill="#ffffff" opacity="0.8"/>

  <!-- wordmark -->
  <text x="470" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="200" letter-spacing="3" fill="#ede9ff">Memory Palace</text>
  <g>
    <rect x="474" y="312" width="86" height="42" rx="10" fill="none" stroke="url(#teal2)" stroke-width="1.8"/>
    <text x="517" y="342" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="6" fill="url(#teal2)">AR</text>
  </g>
  <text x="474" y="395" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="300" letter-spacing="5" fill="#9a8be8" opacity="0.85">YOUR WORLD, REMEMBERED</text>

  <text x="36" y="572" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="2" fill="#8f80c9" opacity="0.5">CONCEPT 2 · SIGIL</text>
</svg>
